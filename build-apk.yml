name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - name: Android platform banao (lib aur pubspec safe rakhte hue)
        run: |
          mkdir /tmp/src && cp -r lib pubspec.yaml /tmp/src/
          flutter create --org com.budgetbook --project-name budget_book --platforms android .
          cp -r /tmp/src/lib/. lib/ && cp /tmp/src/pubspec.yaml pubspec.yaml
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: budget-book-apk
          path: build/app/outputs/flutter-apk/app-release.apk
